        import tarfile
        paths = ["pr-validation-source.txt", "apps/vscode/test-results", "apps/vscode/coverage-unit", "apps/vscode/webview-ui/coverage", "apps/vscode/coverage", "apps/cli/src/tests/tui-traces"]
        with tarfile.open("pr-validation-evidence.tar.gz", "w:gz") as archive:
            for name in paths:
