# Fork-only exact-source test validation; tar preserves coverage paths unsupported by artifact ZIP transport.
name: PR 13735 exact-source validation
'on':
  push:
    branches:
    - ci/pr-13735-validation-20261009
permissions:
  contents: read
concurrency:
  group: pr13735-validation-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: 'true'
  GITHUB_TOKEN: ''
  GH_TOKEN: ''
  CLINE_TELEMETRY_DISABLED: '1'
  CLINE_VCR: playback
  CLINE_NO_AUTO_UPDATE: '1'
  NO_UPDATE_NOTIFIER: '1'
jobs:
  sdk-quality:
    runs-on: ubuntu-latest
    name: sdk-quality / Quality Checks
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 1702249d7a6cb9300e4b1ce33c1ef3192b32c45e
        persist-credentials: false
    - name: Verify exact PR source
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "1702249d7a6cb9300e4b1ce33c1ef3192b32c45e"
        printf "%s\n" "1702249d7a6cb9300e4b1ce33c1ef3192b32c45e" > pr-validation-source.txt
        git rev-parse HEAD
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.13
    - name: Install dependencies
      run: bun install
    - name: Typecheck
      run: |
        bun run build:sdk
        bun run -F @cline/cli build
        bun run types
    - name: Lint & Format
      run: bun run lint
    - name: Record final checkout status
      if: ${{ always() }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        git status --short >> pr-validation-source.txt
    - name: Package test evidence
      if: ${{ always() }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        python - <<'PYTHON'
        from pathlib import Path
        import tarfile
        paths = ["pr-validation-source.txt", "apps/vscode/test-results", "apps/vscode/coverage-unit", "apps/vscode/webview-ui/coverage", "apps/vscode/coverage", "apps/cli/src/tests/tui-traces"]
        with tarfile.open("pr-validation-evidence.tar.gz", "w:gz") as archive:
            for name in paths:
                if Path(name).exists():
                    archive.add(name, arcname=name)
        PYTHON
    - name: Save test evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: pr13735-sdk-quality-${{ runner.os }}
        if-no-files-found: warn
        path: pr-validation-evidence.tar.gz
        retention-days: 14
    timeout-minutes: 45
    permissions:
      contents: read
  sdk-test:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          node-version: 24.x
        - os: windows-latest
          node-version: 24.x
    runs-on: ${{ matrix.os }}
    name: sdk-test / Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 1702249d7a6cb9300e4b1ce33c1ef3192b32c45e
        persist-credentials: false
    - name: Verify exact PR source
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "1702249d7a6cb9300e4b1ce33c1ef3192b32c45e"
        printf "%s\n" "1702249d7a6cb9300e4b1ce33c1ef3192b32c45e" > pr-validation-source.txt
        git rev-parse HEAD
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.13
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ matrix.node-version }}
    - name: Install dependencies
      run: bun install
    - name: Build SDK
      id: build_sdk_step
      run: bun run build:sdk
    - name: Build CLI
      id: build_cli_step
      if: ${{ !cancelled() && steps.build_sdk_step.outcome == 'success' }}
      run: bun -F @cline/cli build
    - name: Run Tests
      if: ${{ !cancelled() && steps.build_sdk_step.outcome == 'success' && steps.build_cli_step.outcome == 'success' && matrix.os
        != 'windows-latest' }}
      run: bun run test
    - name: Run SDK Tests (Windows)
      if: ${{ !cancelled() && steps.build_sdk_step.outcome == 'success' && steps.build_cli_step.outcome == 'success' && matrix.os
        == 'windows-latest' }}
      run: bun -F './sdk/packages/**' test
    - name: Run Desktop Sidecar Tests
      if: ${{ !cancelled() && steps.build_sdk_step.outcome == 'success' && matrix.os == 'ubuntu-latest' }}
      run: bun -F @cline/code test:sidecar
    - name: Run Desktop Settings UI Tests
      if: ${{ !cancelled() && steps.build_sdk_step.outcome == 'success' }}
      run: bun -F @cline/code test:settings-ui
    - name: Smoke test SQLite under Node
      if: ${{ !cancelled() && steps.build_sdk_step.outcome == 'success' && matrix.os != 'windows-latest' }}
      timeout-minutes: 10
      run: bun sdk/scripts/ci-node-smoke.ts
    - name: Run TUI e2e tests
      if: ${{ !cancelled() && steps.build_sdk_step.outcome == 'success' && steps.build_cli_step.outcome == 'success' && matrix.os
        == 'ubuntu-latest' && matrix.node-version == '24.x' }}
      run: bun -F @cline/cli test:e2e:cli:tui
    - name: Verify packages are publishable
      if: ${{ !cancelled() && steps.build_sdk_step.outcome == 'success' && steps.build_cli_step.outcome == 'success' && matrix.os
        == 'ubuntu-latest' && matrix.node-version == '24.x' }}
      run: bun sdk/scripts/check-publish.ts
    - name: Record final checkout status
      if: ${{ always() }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        git status --short >> pr-validation-source.txt
    - name: Package test evidence
      if: ${{ always() }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        python - <<'PYTHON'
        from pathlib import Path
        import tarfile
        paths = ["pr-validation-source.txt", "apps/vscode/test-results", "apps/vscode/coverage-unit", "apps/vscode/webview-ui/coverage", "apps/vscode/coverage", "apps/cli/src/tests/tui-traces"]
        with tarfile.open("pr-validation-evidence.tar.gz", "w:gz") as archive:
            for name in paths:
                if Path(name).exists():
                    archive.add(name, arcname=name)
        PYTHON
    - name: Save test evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: pr13735-sdk-test-${{ runner.os }}
        if-no-files-found: warn
        path: pr-validation-evidence.tar.gz
        retention-days: 14
    timeout-minutes: 45
    permissions:
      contents: read
  extension-quality:
    runs-on: ubuntu-latest
    name: extension-quality / Quality Checks
    defaults:
      run:
        working-directory: apps/vscode
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 1702249d7a6cb9300e4b1ce33c1ef3192b32c45e
        persist-credentials: false
    - name: Verify exact PR source
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "1702249d7a6cb9300e4b1ce33c1ef3192b32c45e"
        printf "%s\n" "1702249d7a6cb9300e4b1ce33c1ef3192b32c45e" > pr-validation-source.txt
        git rev-parse HEAD
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.14
    - name: Install workspace dependencies
      working-directory: ${{ github.workspace }}
      run: bun install --frozen-lockfile
    - name: Build SDK packages
      working-directory: ${{ github.workspace }}
      run: bun run build:sdk
    - name: Assert better-sqlite3 native binary present
      run: |
        NODE_FILE="node_modules/better-sqlite3/build/Release/better_sqlite3.node"
        if [ ! -f "$NODE_FILE" ]; then
          echo "ERROR: better-sqlite3 native binary missing at apps/vscode/$NODE_FILE"
          echo "(bun trustedDependencies postinstall likely did not run)"
          exit 1
        fi
        echo "Found better-sqlite3 native binary: $NODE_FILE"
    - name: Run Quality Checks (Parallel)
      run: bun run ci:check-all
    - name: Record final checkout status
      if: ${{ always() }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        git status --short >> pr-validation-source.txt
    - name: Package test evidence
      if: ${{ always() }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        python - <<'PYTHON'
        from pathlib import Path
        import tarfile
        paths = ["pr-validation-source.txt", "apps/vscode/test-results", "apps/vscode/coverage-unit", "apps/vscode/webview-ui/coverage", "apps/vscode/coverage", "apps/cli/src/tests/tui-traces"]
        with tarfile.open("pr-validation-evidence.tar.gz", "w:gz") as archive:
            for name in paths:
                if Path(name).exists():
                    archive.add(name, arcname=name)
        PYTHON
    - name: Save test evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: pr13735-extension-quality-${{ runner.os }}
        if-no-files-found: warn
        path: pr-validation-evidence.tar.gz
        retention-days: 14
    timeout-minutes: 45
    permissions:
      contents: read
  extension-test:
    env:
      VSCODE_TEST_VERSION: 1.101.0
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    name: extension-test / ${{ matrix.os == 'ubuntu-latest' && 'vscode test' || format('vscode test ({0})', matrix.os) }}
    defaults:
      run:
        shell: bash
        working-directory: apps/vscode
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 1702249d7a6cb9300e4b1ce33c1ef3192b32c45e
        persist-credentials: false
    - name: Verify exact PR source
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "1702249d7a6cb9300e4b1ce33c1ef3192b32c45e"
        printf "%s\n" "1702249d7a6cb9300e4b1ce33c1ef3192b32c45e" > pr-validation-source.txt
        git rev-parse HEAD
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.14
    - name: Install workspace dependencies
      working-directory: ${{ github.workspace }}
      run: bun install --frozen-lockfile
    - name: Build SDK packages
      working-directory: ${{ github.workspace }}
      run: bun run build:sdk
    - name: Assert better-sqlite3 native binary present
      run: |
        NODE_FILE="node_modules/better-sqlite3/build/Release/better_sqlite3.node"
        if [ ! -f "$NODE_FILE" ]; then
          echo "ERROR: better-sqlite3 native binary missing at apps/vscode/$NODE_FILE"
          echo "(bun trustedDependencies postinstall likely did not run)"
          exit 1
        fi
        echo "Found better-sqlite3 native binary: $NODE_FILE"
    - name: Cache VS Code test runtime
      if: runner.os == 'Windows'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: .vscode-test
        key: vscode-test-runtime-${{ runner.os }}-${{ env.VSCODE_TEST_VERSION }}
    - name: Build Tests and Extension
      id: build_step
      run: bun run ci:build
    - name: Vitest Suites (SDK adapter + model catalog)
      id: vitest_tests
      if: ${{ !cancelled() && steps.build_step.outcome == 'success' }}
      run: "set -o pipefail\nbun run test:vitest 2>&1 | tee vitest-output.log\n# Strip ANSI color codes before matching \u2014\
        \ vitest colorizes the\n# \"Tests  N passed\" summary, so the count is not adjacent to the\n# \"Tests\" label in the\
        \ raw bytes.\nif ! sed -r 's/\\x1b\\[[0-9;]*m//g' vitest-output.log | grep -Eq 'Tests[[:space:]]+[0-9]*[1-9][0-9]*\
        \ (passed|failed)'; then\n  echo \"ERROR: vitest reported zero tests (possible silent skip).\"\n  exit 1\nfi\n"
    - name: Unit Tests (bun) - Linux
      id: unit_tests_linux
      if: ${{ !cancelled() && steps.build_step.outcome == 'success' && runner.os == 'Linux' }}
      run: |
        set -o pipefail
        bun run test:unit 2>&1 | tee unit-output.log
        if ! grep -Eq 'Pass:[[:space:]]+[0-9]*[1-9][0-9]*' unit-output.log; then
          echo "ERROR: bun unit runner reported zero passing tests (possible silent skip)."
          exit 1
        fi
    - name: Unit Tests (bun) - Non-Linux
      id: unit_tests_non_linux
      if: ${{ !cancelled() && steps.build_step.outcome == 'success' && runner.os != 'Linux' }}
      run: |
        bun run test:unit
    - name: Extension Integration Tests - Linux
      id: integration_tests_linux
      if: ${{ !cancelled() && steps.build_step.outcome == 'success' && runner.os == 'Linux' }}
      run: xvfb-run -a bun run test:coverage
    - name: Extension Integration Tests - Non-Linux
      id: integration_tests_non_linux
      if: ${{ !cancelled() && steps.build_step.outcome == 'success' && runner.os != 'Linux' }}
      run: |
        for attempt in 1 2 3; do
          echo "Running extension integration tests (attempt ${attempt}/3)"
          if bun run test:integration; then
            exit 0
          fi

          if [ "$attempt" -eq 3 ]; then
            echo "Extension integration tests failed after 3 attempts"
            exit 1
          fi

          echo "Extension integration tests failed; retrying after short delay"
          sleep 5
        done
    - name: Webview Tests with Coverage
      id: webview_tests
      if: ${{ !cancelled() && steps.build_step.outcome == 'success' }}
      run: |
        cd webview-ui
        bun run test:coverage
    - name: Save Coverage Reports
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: runner.os == 'Linux'
      with:
        name: pr-coverage-reports
        path: |
          apps/vscode/webview-ui/coverage/lcov.info
    - name: Record final checkout status
      if: ${{ always() }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        git status --short >> pr-validation-source.txt
    - name: Package test evidence
      if: ${{ always() }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        python - <<'PYTHON'
        from pathlib import Path
        import tarfile
        paths = ["pr-validation-source.txt", "apps/vscode/test-results", "apps/vscode/coverage-unit", "apps/vscode/webview-ui/coverage", "apps/vscode/coverage", "apps/cli/src/tests/tui-traces"]
        with tarfile.open("pr-validation-evidence.tar.gz", "w:gz") as archive:
            for name in paths:
                if Path(name).exists():
                    archive.add(name, arcname=name)
        PYTHON
    - name: Save test evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: pr13735-extension-test-${{ runner.os }}
        if-no-files-found: warn
        path: pr-validation-evidence.tar.gz
        retention-days: 14
    timeout-minutes: 45
    permissions:
      contents: read
  testing-platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vscode
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 1702249d7a6cb9300e4b1ce33c1ef3192b32c45e
        persist-credentials: false
    - name: Verify exact PR source
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
