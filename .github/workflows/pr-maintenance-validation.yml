      with:
        name: pr13735-testing-platform-${{ runner.os }}
        if-no-files-found: warn
        path: pr-validation-evidence.tar.gz
        retention-days: 14
    timeout-minutes: 20
    permissions:
      contents: read
    name: testing-platform
  extension-e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu
        - runner: windows
        - runner: macos
    runs-on: ${{ matrix.runner }}-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/vscode
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 1702249d7a6cb9300e4b1ce33c1ef3192b32c45e
        persist-credentials: false
    - name: Verify exact PR source
      shell: bash
      working-directory: ${{ github.workspace }}
